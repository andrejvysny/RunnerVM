# Parsers referenced by fluent-bit.conf.

# runnerd.log and events.jsonl are one JSON object per line. `Time_Key` differs between the two
# streams (`timestamp` vs `ts`), so the parser keeps both keys on the record and lets the output
# plugin stamp the ingest time; use two parsers if you need the emitted time to be authoritative.
[PARSER]
    Name        runnervm_json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
