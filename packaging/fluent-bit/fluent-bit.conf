# Fluent Bit pipeline for RunnerVM host logs. Example, not installed by scripts/install.sh.
#
# REPLACE BEFORE USE:
#   * every "/Library/Application Support/RunnerVM" below — your --state-dir
#   * the ${RUNNERVM_HOST_ID} environment variable, or drop the record_modifier filters and let
#     your backend attribute by hostname
#   * the [OUTPUT] section — the OpenSearch block is commented out and `stdout` is active, so a
#     first run prints to the terminal instead of shipping anywhere
#
# Run:  fluent-bit -c packaging/fluent-bit/fluent-bit.conf
#
# Fluent Bit must run as a user that can read <state-dir>/logs (mode 0750, owned by the service
# account).

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    # Position database, so a restart does not re-ship every file from the beginning.
    storage.path  /var/lib/fluent-bit/

# --- Inputs ----------------------------------------------------------------

# The daemon's own JSON log. `Path_Key file` keeps the source path on the record.
# The `.1 … .N` archives are excluded: RotatingFileSink renames rather than truncates, and
# without this Fluent Bit would re-ingest every archive as a new file.
[INPUT]
    Name           tail
    Tag            runnervm.runnerd
    Path           /Library/Application Support/RunnerVM/logs/runnerd/runnerd.log
    Exclude_Path   /Library/Application Support/RunnerVM/logs/runnerd/runnerd.log.*
    Path_Key       file
    DB             /var/lib/fluent-bit/runnerd.db
    Parser         runnervm_json
    Refresh_Interval 5
    Skip_Long_Lines On

[INPUT]
    Name           tail
    Tag            runnervm.events
    Path           /Library/Application Support/RunnerVM/logs/events.jsonl
    Exclude_Path   /Library/Application Support/RunnerVM/logs/events.jsonl.*
    Path_Key       file
    DB             /var/lib/fluent-bit/events.db
    Parser         runnervm_json
    Refresh_Interval 5

# Per-instance guest output. Deliberately unparsed: serial.log is a raw console capture and
# worker.log is vmworker's stdout/stderr, neither of which is JSON.
[INPUT]
    Name           tail
    Tag            runnervm.instance
    Path           /Library/Application Support/RunnerVM/logs/instances/*/serial.log,/Library/Application Support/RunnerVM/logs/instances/*/worker.log
    Path_Key       file
    DB             /var/lib/fluent-bit/instances.db
    Refresh_Interval 15
    Buffer_Max_Size 1M
    Skip_Long_Lines On

# --- Filters ---------------------------------------------------------------

[FILTER]
    Name          record_modifier
    Match         runnervm.runnerd
    Record        source runnerd
    Record        host_id ${RUNNERVM_HOST_ID}

[FILTER]
    Name          record_modifier
    Match         runnervm.events
    Record        source events
    Record        host_id ${RUNNERVM_HOST_ID}

[FILTER]
    Name          record_modifier
    Match         runnervm.instance
    Record        source instance
    Record        host_id ${RUNNERVM_HOST_ID}

# `file` is "<...>/logs/instances/<instance-id>/<name>.log". The id and the stream name exist only
# in that path for these two files, so lift them onto the record.
[FILTER]
    Name          lua
    Match         runnervm.instance
    script        instance_path.lua
    call          split_instance_path

# --- Output ----------------------------------------------------------------

# Active by default so a first run is visibly correct before anything is shipped anywhere.
[OUTPUT]
    Name          stdout
    Match         runnervm.*
    Format        json_lines

# REPLACE and uncomment to ship to OpenSearch. Index per day; `Suppress_Type_Name On` is required
# for OpenSearch and Elasticsearch 8+.
# [OUTPUT]
#     Name              opensearch
#     Match             runnervm.*
#     Host              opensearch.example.internal
#     Port              9200
#     HTTP_User         ${OPENSEARCH_USER}
#     HTTP_Passwd       ${OPENSEARCH_PASSWORD}
#     tls               On
#     Index             runnervm
#     Logstash_Format   On
#     Logstash_Prefix   runnervm
#     Suppress_Type_Name On
#     Retry_Limit       5
