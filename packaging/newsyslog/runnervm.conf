# newsyslog(8) rotation for RunnerVM host logs.
#
# Not installed automatically by scripts/install.sh (rotation is optional operator policy).
# To enable: replace __STATE_DIR__ below with the real state directory
# (default /Library/Application Support/RunnerVM), then:
#
#   sudo cp packaging/newsyslog/runnervm.conf /etc/newsyslog.d/runnervm.conf
#
# newsyslog runs from a periodic launchd job (com.apple.periodic-daily); check with
# `sudo newsyslog -nvv | grep runnervm`.
#
# Caveat: runnerd keeps its log file descriptor open for its whole lifetime and never reopens it
# on SIGHUP or otherwise, so rotation (rename + recreate) only takes effect starting from the next
# time the daemon restarts (`launchctl kickstart -k`, a crash restart, or reboot) — see
# packaging/launchd/README.md.
#
# logfilename                                    [owner:group]     mode count size(KB) when  flags
__STATE_DIR__/logs/runnerd.log                    __SERVICE_USER__:staff  640  10   10240    $D0   GZ
__STATE_DIR__/logs/instances/*.log                __SERVICE_USER__:staff  640  10   10240    $D0   GZ
