# newsyslog(8) rotation for RunnerVM host logs.
#
# OPTIONAL. `runnerd` already rotates its own files in process — `logging.file.maxSize` /
# `logging.file.maxFiles`, default 32MiB x 10 — so this exists only for operators who want a
# single, host-wide, time-based policy (`$D0`) with gzip, or who want to keep the launchd stdio
# file bounded.
#
# To enable: replace __STATE_DIR__ below with the real state directory
# (default /Library/Application Support/RunnerVM) and __SERVICE_USER__ with the service account,
# then:
#
#   sudo cp packaging/newsyslog/runnervm.conf /etc/newsyslog.d/runnervm.conf
#
# newsyslog runs from a periodic launchd job (com.apple.periodic-daily); check with
# `sudo newsyslog -nvv | grep runnervm`.
#
# Rotation now takes effect immediately: `runnerd` installs a SIGHUP handler that reopens every
# log file it owns (`Sources/RunnerLogging/RotatingFileSink.swift`), so a rename-and-recreate
# rotation stops the old file growing as soon as the daemon is signalled. newsyslog's `pid_file`
# column signals a pid; launchd owns runnerd's pid and writes no pid file, so signal it with
#
#   sudo launchctl kill HUP system/com.runnervm.runnerd          # LaunchDaemon variant
#   launchctl kill HUP gui/$(id -u _runnervm)/com.runnervm.runnerd   # LaunchAgent variant
#
# and, if you want that automatic, wrap it in a daily launchd job of your own. Without the signal
# the in-process rotation still bounds each file, so nothing grows without limit either way.
#
# logfilename                                     [owner:group]           mode count size(KB) when  flags
__STATE_DIR__/logs/runnerd/runnerd.log             __SERVICE_USER__:staff  640  10   32768    $D0   GZ
__STATE_DIR__/logs/runnerd/stdio.log               __SERVICE_USER__:staff  640  5    10240    $D0   GZ
__STATE_DIR__/logs/events.jsonl                    __SERVICE_USER__:staff  640  10   32768    $D0   GZ
__STATE_DIR__/logs/instances/*/serial.log          __SERVICE_USER__:staff  640  3    10240    $D0   GZ
__STATE_DIR__/logs/instances/*/worker.log          __SERVICE_USER__:staff  640  3    10240    $D0   GZ
