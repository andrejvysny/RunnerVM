# RunnerVM — blackpen (olympics-Mac-mini, Apple M4, 10 cores, 32 GiB RAM)
#
# Sized for one Linux runner at a time (2026-08-28). Disk is the binding
# constraint: instance disk reservation is max(profile.resources.disk,
# image.virtualBytes) and the shipped ubuntu-24 image carries a 16 GiB disk
# layer, so every instance reserves 16 GiB no matter what the profile asks for.
#
# A macOS profile is deliberately NOT here. A macOS guest cannot resize its APFS
# container, so its reservation is the image's entire 50 GB virtual disk; with
# the 30 GiB image stored this host would need ~48 GiB free for one macOS guest
# alone and ~65 GiB to run one beside the Ubuntu one. It has 62 GiB free and
# ~8.5 GiB reclaimable. See docs/verification.md, "Mac mini deployment".
version: 1

host:
  reserve:
    cpu: 2          # 10 logical - 2 => 8 vCPU budget
    memory: 6GiB    # 32 - 6 => 26 GiB budget
    disk: 4GiB      # absolute free-space floor
  # Left at the 1.0 default here. Raise it only to admit a guest whose disk is sparse --
  # a macOS image is 50 GB apparent against ~30 GiB allocated, and the instance disk is an
  # APFS clone that only grows as the job writes, so admission's worst-case reservation
  # refuses guests this host would run comfortably. This machine needs ~1.51 for one macOS
  # guest. The risk is real: a job that truly fills its disk exhausts host storage.
  overcommit:
    disk: 1.0
  maxVMs: 1         # one runner at a time on this host

github:
  demand: scaleSet
  auth:
    provider: pat
    source: file    # <state-dir>/github-token, 0600 — no login keychain, host is headless
  scopes:
    - name: repo
      type: repository
      owner: andrejvysny
      repository: RunnerVM

security:
  allowPublicRepositories: true

# Failed sessions hold their cpu/memory/disk reservation until this expires.
# The default 2h would strand 16 GiB on a host this small.
diagnostics:
  failedInstanceRetention: 15m

metrics:
  prometheus:
    enabled: true
    listen: 127.0.0.1:9101

# Storage ceilings. Per-job storage is already fully reclaimed (an ephemeral instance's
# disk is deleted with the VM), so these bound only what outlives a job:
#   - instance logs, one directory per job under logs/instances/ (~75 KiB each)
#   - superseded image digests, which linger after a rebuild until `image prune`
#   - the base-image cache the in-daemon builder converts cloud images into
images:
  cache:
    maxSize: 20GiB          # image store ceiling; LRU-evicts unpinned, unreferenced digests
    keepRecentlyUsed: 24h

logging:
  retention:
    instanceLogs: 3d

profiles:
  - name: ubuntu-24
    scope: repo
    image: ubuntu-24
    lifecycle: ephemeral
    resources:
      cpu: 4          # the only guest, so give it more than the 2/4GiB used when 3 ran
      memory: 8GiB
      disk: 16GiB     # must be >= the image's 16 GiB disk layer
    limits:
      maxInstances: 1
    ssh:
      enabled: true
    timeouts:
      agentReady: 3m

build:
  cpu: 4
  memory: 4GiB
  disk: 16GiB
  cache:
    maxBytes: 8GiB          # converted cloud-image bases; rebuilt on demand when evicted
    minimumHostFreeBytes: 10GiB
