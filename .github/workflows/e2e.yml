# Copy this file to .github/workflows/e2e.yml in the DEDICATED test repo that
# scripts/live-github-e2e.sh drives (RUNNERVM_E2E_REPO). See docs/live-integration.md.
#
# `runs-on: ${{ inputs.profile }}` matches the scale-set naming RunnerVM registers for
# each profile (Sources/Orchestration/DemandProvider.swift: prefix "runnervm-"), so a job here is
# picked up by that profile's scale set exactly the way any other GitHub Actions job would be.
#
# LONG_MINUTES below must match the driver's --long-minutes (default 65): this workflow only
# takes job/count/profile as inputs, so the "long" job's duration is fixed here, not passed in.
#
# The steps are OS-neutral on purpose: `runs-on: ${{ inputs.profile }}` may be a Linux or a macOS
# RunnerVM profile, and both scripts/live-github-e2e.sh and scripts/live-macos-e2e.sh drive this
# same file. Anything guest-specific goes behind a `uname -s` case, never at the top level.
name: RunnerVM E2E

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job type"
        required: true
        type: choice
        options: [quick, long, matrix]
        default: quick
      count:
        description: "Matrix size (matrix job only; ignored otherwise)"
        required: false
        default: "1"
      profile:
        description: "RunnerVM profile name (the runs-on label)"
        required: true
        default: ubuntu-24
      minutes:
        description: "Minutes the long job sleeps (long job only; the driver passes 5 for restart/cancel scenarios, 65 for long-job)"
        required: false
        default: "65"

permissions:
  contents: read

env:
  LONG_MINUTES: ${{ github.event.inputs.minutes || '65' }}

jobs:
  quick:
    if: ${{ inputs.job == 'quick' }}
    runs-on: ${{ inputs.profile }}
    timeout-minutes: 15
    steps:
      - name: Host facts
        run: |
          # One probe for both guest families: `runs-on: <profile>` may now be a macOS runner, and
          # `docker info` on a macOS guest is not a soft failure -- it fails the step and turns
          # every macOS E2E run red for a reason that has nothing to do with RunnerVM. GitHub
          # documents container actions and service containers as Linux-only, so the Docker probe
          # belongs behind the OS check rather than in the common part.
          set -eu
          echo "--- common ---"
          uname -a
          id
          git --version
          case "$(uname -s)" in
          Darwin)
            echo "--- darwin ---"
            sw_vers
            uname -m
            xcode-select -p || echo "no Command Line Tools"
            security list-keychains
            # The guest agent is the control plane; a job that runs at all proves it, but the
            # LaunchDaemon's state is the thing worth seeing in the log when one does not.
            sudo launchctl print system/com.runnervm.guest-agent >/dev/null 2>&1 \
              && echo "guest agent: loaded" || echo "guest agent: NOT LOADED"
            ;;
          Linux)
            echo "--- linux ---"
            cat /etc/os-release
            docker info
            systemctl is-system-running || true
            ;;
          esac

      - name: Write a marker
        run: |
          mkdir -p "$RUNNER_TEMP/rvm-e2e"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/rvm-e2e/marker"
          cat "$RUNNER_TEMP/rvm-e2e/marker"

  long:
    if: ${{ inputs.job == 'long' }}
    runs-on: ${{ inputs.profile }}
    # LONG_MINUTES + generous headroom for boot/queue/teardown.
    timeout-minutes: 90
    steps:
      - name: Sleep in 1-minute ticks
        run: |
          # `sleep 60 & wait` instead of a plain `sleep`: bash defers SIGINT while a foreground
          # child runs and then carries on when the child did not die of it, so a plain sleep
          # loop ignores the runner's cancellation until its 5-minute force-kill timeout (seen
          # live). `wait` returns on the signal, which is what a cancel test needs.
          for i in $(seq 1 "$LONG_MINUTES"); do
            echo "tick $i/$LONG_MINUTES $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 60 & wait $!
          done

  # Generates a JSON array [1..count] on a GitHub-hosted runner (cheap, no RunnerVM dependency)
  # so the matrix job below can fan out to `count` concurrent RunnerVM jobs. GitHub Actions
  # expressions have no range()/sequence function, hence the extra job instead of an inline matrix.
  matrix-setup:
    if: ${{ inputs.job == 'matrix' }}
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.gen.outputs.indices }}
    steps:
      - id: gen
        env:
          COUNT_INPUT: ${{ inputs.count }}
        run: |
          echo "indices=$(seq 1 "$COUNT_INPUT" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  matrix:
    if: ${{ inputs.job == 'matrix' }}
    needs: matrix-setup
    runs-on: ${{ inputs.profile }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.matrix-setup.outputs.indices) }}
    steps:
      - name: Host facts (${{ matrix.index }} of ${{ inputs.count }})
        run: |
          echo "job ${{ matrix.index }} of ${{ inputs.count }}"
          # One probe for both guest families: `runs-on: <profile>` may now be a macOS runner, and
          # `docker info` on a macOS guest is not a soft failure -- it fails the step and turns
          # every macOS E2E run red for a reason that has nothing to do with RunnerVM. GitHub
          # documents container actions and service containers as Linux-only, so the Docker probe
          # belongs behind the OS check rather than in the common part.
          set -eu
          echo "--- common ---"
          uname -a
          id
          git --version
          case "$(uname -s)" in
          Darwin)
            echo "--- darwin ---"
            sw_vers
            uname -m
            xcode-select -p || echo "no Command Line Tools"
            security list-keychains
            # The guest agent is the control plane; a job that runs at all proves it, but the
            # LaunchDaemon's state is the thing worth seeing in the log when one does not.
            sudo launchctl print system/com.runnervm.guest-agent >/dev/null 2>&1 \
              && echo "guest agent: loaded" || echo "guest agent: NOT LOADED"
            ;;
          Linux)
            echo "--- linux ---"
            cat /etc/os-release
            docker info
            systemctl is-system-running || true
            ;;
          esac
