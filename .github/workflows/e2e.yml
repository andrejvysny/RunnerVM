# Copy this file to .github/workflows/e2e.yml in the DEDICATED test repo that
# scripts/live-github-e2e.sh drives (RUNNERVM_E2E_REPO). See docs/live-integration.md.
#
# `runs-on: ${{ inputs.profile }}` matches the scale-set naming RunnerVM registers for
# each profile (Sources/Orchestration/DemandProvider.swift: prefix "runnervm-"), so a job here is
# picked up by that profile's scale set exactly the way any other GitHub Actions job would be.
#
# LONG_MINUTES below must match the driver's --long-minutes (default 65): this workflow only
# takes job/count/profile as inputs, so the "long" job's duration is fixed here, not passed in.
#
# The steps are OS-neutral on purpose: `runs-on: ${{ inputs.profile }}` may be a Linux or a macOS
# RunnerVM profile, and both scripts/live-github-e2e.sh and scripts/live-macos-e2e.sh drive this
# same file. Anything guest-specific goes behind a `uname -s` case, never at the top level.
name: RunnerVM E2E

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job type"
        required: true
        type: choice
        options: [quick, long, matrix, keychain]
        default: quick
      count:
        description: "Matrix size (matrix job only; ignored otherwise)"
        required: false
        default: "1"
      profile:
        description: "RunnerVM profile name (the runs-on label)"
        required: true
        default: ubuntu-24
      minutes:
        description: "Minutes the long job sleeps (long job only; the driver passes 5 for restart/cancel scenarios, 65 for long-job)"
        required: false
        default: "65"

permissions:
  contents: read

env:
  LONG_MINUTES: ${{ github.event.inputs.minutes || '65' }}

jobs:
  quick:
    if: ${{ inputs.job == 'quick' }}
    runs-on: ${{ inputs.profile }}
    timeout-minutes: 15
    steps:
      - name: Host facts
        run: |
          # One probe for both guest families: `runs-on: <profile>` may now be a macOS runner, and
          # `docker info` on a macOS guest is not a soft failure -- it fails the step and turns
          # every macOS E2E run red for a reason that has nothing to do with RunnerVM. GitHub
          # documents container actions and service containers as Linux-only, so the Docker probe
          # belongs behind the OS check rather than in the common part.
          set -eu
          echo "--- common ---"
          uname -a
          id
          git --version
          case "$(uname -s)" in
          Darwin)
            echo "--- darwin ---"
            sw_vers
            uname -m
            xcode-select -p || echo "no Command Line Tools"
            security list-keychains
            # The guest agent is the control plane; a job that runs at all proves it, but the
            # LaunchDaemon's state is the thing worth seeing in the log when one does not.
            sudo launchctl print system/com.runnervm.guest-agent >/dev/null 2>&1 \
              && echo "guest agent: loaded" || echo "guest agent: NOT LOADED"
            ;;
          Linux)
            echo "--- linux ---"
            cat /etc/os-release
            docker info
            systemctl is-system-running || true
            ;;
          esac

      - name: Write a marker
        run: |
          mkdir -p "$RUNNER_TEMP/rvm-e2e"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/rvm-e2e/marker"
          cat "$RUNNER_TEMP/rvm-e2e/marker"

  # Real-job proof of the per-VM macOS CI keychain (D9, Proto/guest_agent.md): `--profile` must be a
  # macOS RunnerVM profile. Mirrors the guest agent's own `agent.selfTest` ladder step for step, but
  # as an actual workflow job on an actual runner instead of a self-check the agent runs on its own
  # behalf — this is the piece `docs/macos-guests.md` "CI keychain" calls still hardware-pending.
  keychain:
    if: ${{ inputs.job == 'keychain' }}
    runs-on: ${{ inputs.profile }}
    timeout-minutes: 15
    steps:
      - name: Assert this is a macOS RunnerVM profile with a CI keychain
        run: |
          set -eu
          if [ "$(uname -s)" != "Darwin" ]; then
            echo "::error::keychain job requires a macOS RunnerVM profile; --profile resolved to a Linux guest" >&2
            exit 1
          fi
          : "${RUNNERVM_CI_KEYCHAIN:?RUNNERVM_CI_KEYCHAIN is not set — the guest agent should have injected this before spawning the runner}"
          : "${RUNNERVM_CI_KEYCHAIN_PASSWORD:?RUNNERVM_CI_KEYCHAIN_PASSWORD is not set}"
          echo "keychain: $RUNNERVM_CI_KEYCHAIN"
          security show-keychain-info "$RUNNERVM_CI_KEYCHAIN"

      - name: Import a self-signed codesigning cert and sign a copy of a real binary
        run: |
          # Mirrors Proto/guest_agent.md's agent.selfTest ladder, one check per step, so a failure
          # here points at the same step name a selfTest failure would report:
          #   generate self-signed codesigning cert -> export PKCS#12 -> security import
          #   (codesign pre-authorised) -> set key partition list -> codesign a copy of a real
          #   binary -> verify the signature -> clean up.
          set -eu
          WORK="$RUNNER_TEMP/rvm-e2e-keychain"
          mkdir -p "$WORK"
          cd "$WORK"
          IDENTITY="RunnerVM E2E Keychain Test"
          P12_PASSWORD="rvm-e2e-$(date -u +%s)"

          echo "--- generate self-signed codesigning cert ---"
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 1 -nodes \
            -subj "/CN=$IDENTITY" -addext "extendedKeyUsage=codeSigning"

          echo "--- export PKCS#12 ---"
          openssl pkcs12 -export -out cert.p12 -inkey key.pem -in cert.pem \
            -passout "pass:$P12_PASSWORD" \
            || openssl pkcs12 -export -legacy -out cert.p12 -inkey key.pem -in cert.pem \
                 -passout "pass:$P12_PASSWORD"

          echo "--- security import (codesign pre-authorised) ---"
          security import cert.p12 -k "$RUNNERVM_CI_KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign

          echo "--- set key partition list ---"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$RUNNERVM_CI_KEYCHAIN_PASSWORD" "$RUNNERVM_CI_KEYCHAIN"

          echo "--- codesign a copy of a real binary ---"
          cp /usr/bin/true "$WORK/true-copy"
          codesign --keychain "$RUNNERVM_CI_KEYCHAIN" -s "$IDENTITY" "$WORK/true-copy"

          echo "--- verify the signature ---"
          codesign -v "$WORK/true-copy"

          echo "--- clean up ---"
          rm -f "$WORK"/key.pem "$WORK"/cert.pem "$WORK"/cert.p12 "$WORK"/true-copy

          echo "keychain e2e: import + codesign + verify all passed"

  long:
    if: ${{ inputs.job == 'long' }}
    runs-on: ${{ inputs.profile }}
    # LONG_MINUTES + generous headroom for boot/queue/teardown.
    timeout-minutes: 90
    steps:
      - name: Sleep in 1-minute ticks
        run: |
          # `sleep 60 & wait` instead of a plain `sleep`: bash defers SIGINT while a foreground
          # child runs and then carries on when the child did not die of it, so a plain sleep
          # loop ignores the runner's cancellation until its 5-minute force-kill timeout (seen
          # live). `wait` returns on the signal, which is what a cancel test needs.
          for i in $(seq 1 "$LONG_MINUTES"); do
            echo "tick $i/$LONG_MINUTES $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 60 & wait $!
          done

  # Generates a JSON array [1..count] on a GitHub-hosted runner (cheap, no RunnerVM dependency)
  # so the matrix job below can fan out to `count` concurrent RunnerVM jobs. GitHub Actions
  # expressions have no range()/sequence function, hence the extra job instead of an inline matrix.
  matrix-setup:
    if: ${{ inputs.job == 'matrix' }}
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.gen.outputs.indices }}
    steps:
      - id: gen
        env:
          COUNT_INPUT: ${{ inputs.count }}
        run: |
          echo "indices=$(seq 1 "$COUNT_INPUT" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  matrix:
    if: ${{ inputs.job == 'matrix' }}
    needs: matrix-setup
    runs-on: ${{ inputs.profile }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.matrix-setup.outputs.indices) }}
    steps:
      - name: Host facts (${{ matrix.index }} of ${{ inputs.count }})
        run: |
          echo "job ${{ matrix.index }} of ${{ inputs.count }}"
          # One probe for both guest families: `runs-on: <profile>` may now be a macOS runner, and
          # `docker info` on a macOS guest is not a soft failure -- it fails the step and turns
          # every macOS E2E run red for a reason that has nothing to do with RunnerVM. GitHub
          # documents container actions and service containers as Linux-only, so the Docker probe
          # belongs behind the OS check rather than in the common part.
          set -eu
          echo "--- common ---"
          uname -a
          id
          git --version
          case "$(uname -s)" in
          Darwin)
            echo "--- darwin ---"
            sw_vers
            uname -m
            xcode-select -p || echo "no Command Line Tools"
            security list-keychains
            # The guest agent is the control plane; a job that runs at all proves it, but the
            # LaunchDaemon's state is the thing worth seeing in the log when one does not.
            sudo launchctl print system/com.runnervm.guest-agent >/dev/null 2>&1 \
              && echo "guest agent: loaded" || echo "guest agent: NOT LOADED"
            ;;
          Linux)
            echo "--- linux ---"
            cat /etc/os-release
            docker info
            systemctl is-system-running || true
            ;;
          esac
