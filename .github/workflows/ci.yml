name: ci
on:
  push:
  pull_request:
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Sign vmworker
        run: scripts/sign-dev.sh
      - run: .build/debug/vmworker probe
  go:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: GuestAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: GuestAgent/go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./cmd/guest-agent
